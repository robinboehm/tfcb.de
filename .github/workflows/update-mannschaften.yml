name: Update Mannschaften

# Einmal im Jahr zu Saisonbeginn (1. September, 07:00 UTC) die Teams von tfvb.de übernehmen.
# Manuell jederzeit startbar: Actions → "Update Mannschaften" → Run workflow.
on:
  schedule:
    - cron: '0 7 1 9 *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Mannschaften von tfvb.de laden
        run: node scripts/update-mannschaften.mjs

      - name: Auf Änderungen prüfen
        id: diff
        run: |
          if git diff --quiet -- src/data/mannschaften.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine Änderungen an den Mannschaften."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build prüfen
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm ci
          npm run build

      - name: Commit und Push
        if: steps.diff.outputs.changed == 'true'
        run: |
          SAISON=$(node -p "require('./src/data/mannschaften.json').saison")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/mannschaften.json
          git commit -m "feat: update Mannschaften für Saison ${SAISON}"
          git push

      # Pushes mit GITHUB_TOKEN lösen keine anderen Workflows aus – daher Deploy explizit starten.
      - name: Deployment starten
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
